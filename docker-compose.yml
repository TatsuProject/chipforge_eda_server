name: chipforge_eda_server

# ChipForge EDA server, npu-v2 only (Nangate45; no sky130, no OpenLane, no PDK download).
#
#   docker compose up -d --build
#
# Five services. Two are long-running (eda-gateway, v2-evaluator). Three only build the images the
# evaluator starts as no-network sibling boxes (cf-compiler, cf-rtl, cf-sta); each runs `true`
# once and shows "Exited (0)" in `docker compose ps -a`, by design. The evaluator starts after all
# three have built. Every image is built locally from pinned sources (pull_policy: build).

services:
  eda-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 127.0.0.1 by default: /v2/evaluate runs evaluator code. Set EDA_BIND_ADDRESS=0.0.0.0 in
      # .env only behind a firewall (see .env.example).
      - "${EDA_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      - v2-evaluator
    environment:
      - V2_SERVICE_URL=${V2_SERVICE_URL:-http://v2-evaluator:18080}
      - V2_ADMIN_TOKEN=${V2_ADMIN_TOKEN:-}

  # The box every miner compiler is built and run in. Locally rebuilt and content-pinned.
  cf-compiler:
    platform: linux/amd64
    build: { context: ./v2-compiler }
    image: cf-compiler:v2.1-public
    pull_policy: build
    entrypoint: ["true"]
    restart: "no"

  # RTL tool, simulator and firmware boxes: Ubuntu g++/make/python3 + the xPack RISC-V toolchain.
  # Verilator itself is the evaluator's own (5.038), staged into each box at run time.
  cf-rtl:
    platform: linux/amd64
    build: { context: ./v2-evaluator, target: rtl }
    image: cf-rtl:v2.0
    pull_policy: build
    entrypoint: ["true"]
    restart: "no"

  # OpenSTA box (post-synthesis timing on Nangate45). OpenSTA only: no OpenROAD, no PDK.
  cf-sta:
    platform: linux/amd64
    build: { context: ./v2-evaluator, target: sta }
    image: cf-sta:v2.0
    pull_policy: build
    entrypoint: ["true"]
    restart: "no"

  # Automatic authenticated evaluator install and cgroup-v2 stage scopes.
  v2-evaluator:
    platform: linux/amd64
    build: { context: ./v2-evaluator }
    image: chipforge_eda_server-v2-evaluator:2.0
    pull_policy: build
    depends_on:
      cf-compiler: { condition: service_completed_successfully }
      cf-rtl: { condition: service_completed_successfully }
      cf-sta: { condition: service_completed_successfully }
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host
    stop_grace_period: 30m
    expose: ["18080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${CF_V2_ROOT:-/var/lib/chipforge-v2}:${CF_V2_ROOT:-/var/lib/chipforge-v2}
      - ${CF_V2_SECRETS:-/var/lib/chipforge-v2-secrets}:/run/cf-secrets
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./shared/v2-incoming:/incoming
    environment:
      - CF_V2_ROOT=${CF_V2_ROOT:-/var/lib/chipforge-v2}
      - CF_EVALUATOR_SALT_FILE=/run/cf-secrets/evaluator-salt.bin
      # The sibling box images, by the tags the services above build.
      - CF_COMPILER_IMAGE=cf-compiler:v2.1-public
      - CF_RTL_IMAGE=cf-rtl:v2.0
      - CF_STA_IMAGE=cf-sta:v2.0
      - CF_DOCKER_REQUIRED_SERVICES=
      - CF_V2_CORES=${CF_V2_CORES:-}
      - CF_V2_WORKERS=${CF_V2_WORKERS:-1}
      - CF_V2_ALLOWED_MODES=${CF_V2_ALLOWED_MODES:-T2}
      # OpenSSH Ed25519 public key text; never a private signing key.
      - CF_V2_EVALUATOR_PUBLIC_KEY=${CF_V2_EVALUATOR_PUBLIC_KEY:-}
      - CF_V2_ALLOW_UNSIGNED=${CF_V2_ALLOW_UNSIGNED:-0}
      - CF_V2_ALLOW_RUNC=${CF_V2_ALLOW_RUNC:-0}
      - CF_V2_PREFLIGHT_MIN_DISK_GIB=${CF_V2_PREFLIGHT_MIN_DISK_GIB:-}
      - CF_V2_SERVICE_MEMORY_MAX=${CF_V2_SERVICE_MEMORY_MAX:-5G}
